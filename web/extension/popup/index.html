<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureVault</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="view-login" class="view">
      <h1>SecureVault</h1>
      <p class="subtitle">Sign in to your vault</p>
      <input id="login-email" type="email" placeholder="Email" autocomplete="email" />
      <input id="login-password" type="password" placeholder="Master password" autocomplete="current-password" />
      <button id="login-btn">Sign In</button>
      <p id="login-error" class="error"></p>
    </div>

    <div id="view-2fa" class="view hidden">
      <h1>Two-Factor Auth</h1>
      <p class="subtitle">Enter the code from your authenticator app</p>
      <input id="2fa-code" type="text" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
      <button id="2fa-btn">Verify</button>
      <p id="2fa-error" class="error"></p>
    </div>

    <div id="view-unlock" class="view hidden">
      <h1>SecureVault</h1>
      <p class="subtitle">Unlock your vault</p>
      <input id="unlock-password" type="password" placeholder="Master password" />
      <button id="unlock-btn">Unlock</button>
      <p id="unlock-error" class="error"></p>
      <button id="unlock-logout" class="link-btn">Sign out</button>
    </div>

    <div id="view-vault" class="view hidden">
      <div class="vault-header">
        <h1>SecureVault</h1>
        <button id="vault-logout" class="icon-btn" title="Sign out">⏻</button>
      </div>
      <input id="vault-search" type="text" placeholder="Search entries..." />
      <div id="vault-list"></div>
      <p id="vault-empty" class="hidden">No matching entries</p>
      <p id="vault-error" class="error"></p>
    </div>
  </div>
  <script type="module" src="./script.ts"></script>
</body>
</html>
