services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - securevault

  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=securevault
      - DB_USERNAME=postgres
      - DB_PASSWORD=mg8Jn^#Cpe
      - JWT_SECRET=AHGwDAAO4J/e0FrHjnh/9vHcrIJ1cOC785IhFM2FWIA=
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=mg8Jn^#Cpe
      - SWAGGER_ENABLED=false
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - securevault

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mg8Jn^#Cpe
      - POSTGRES_DB=securevault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securevault

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass mg8Jn^#Cpe
    networks:
      - securevault

volumes:
  postgres_data:

networks:
  securevault:
    driver: bridge
