# Production Configuration
# IMPORTANT: Set these environment variables before deployment

# Database - REQUIRED
DB_HOST=localhost
DB_PORT=5432
DB_NAME=securevault
DB_USERNAME=securevault_user
DB_PASSWORD=CHANGE_ME_STRONG_PASSWORD

# JWT - REQUIRED (must be at least 32 characters)
JWT_SECRET=CHANGE_ME_GENERATE_RANDOM_256_BIT_STRING

# Server
SERVER_PORT=8080
REQUIRE_SSL=true
SSL_ENABLED=false

# Security
LOG_LEVEL=INFO
SWAGGER_ENABLED=false
RATE_LIMIT=30

# Redis (optional)
# REDIS_HOST=localhost
# REDIS_PORT=6379
# REDIS_PASSWORD=

# Logging
logging.file.name=/var/log/securevault/securevault.log