# SecureVault — Production (for Dockploy or similar PaaS with built-in reverse proxy)
# Usage: docker compose -f docker-compose.prod.yaml up -d
# Exposes web on port 3000 (internal) for the platform's reverse proxy to route traffic.
# No Traefik needed — the platform handles SSL and domain routing.

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - securevault

  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=securevault
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SERVER_HASH_SECRET=${SERVER_HASH_SECRET}
      - SWAGGER_ENABLED=false
      - SERVER_ADDRESS=0.0.0.0
      - LOG_LEVEL=INFO
      - APP_PROXY_TRUSTED=true
      # KDF defaults (optional — omit for current defaults: 3-98304-4)
      # - KDF_ITERATIONS=3
      # - KDF_MEMORY=98304
      # - KDF_PARALLELISM=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - securevault

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=securevault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securevault

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - securevault

volumes:
  postgres_data:

networks:
  securevault:
    driver: bridge
